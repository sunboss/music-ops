server {
    listen 80;
    server_name localhost;

    # 1. 统一前端 (YesPlayMusic)
    location / {
        root /app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 动态无侵入注入自适应增强与 AI 助理交互控件
        sub_filter "</head>" "<link rel=\"stylesheet\" href=\"/custom-theme.css\"><script defer src=\"/ai-assistant.js\"></script></head>";
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # 2. 全网聚合搜索与下载服务 (go-music-dl)
    location /dl/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. AI 智能音乐搜索与意图分发中枢
    location /ai/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. 本地音乐库访问
    location /local_music/ {
        alias /data/music/downloads/;
        autoindex on;
    }
}
