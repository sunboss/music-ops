server {
    listen 80;
    server_name localhost;

    # 1. 统一前端 (YesPlayMusic)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 动态无侵入注入自适应增强、专属 Logo 与 AirPlay/DLNA 投屏控件
        sub_filter "</head>" "<link rel=\"stylesheet\" href=\"/custom-theme.css\"><script defer src=\"/custom-player-enhancer.js\"></script></head>";
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # 2. 定制样式、脚本与品牌资产映射
    location = /custom-theme.css {
        alias /etc/nginx/custom/custom-theme.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /custom-player-enhancer.js {
        alias /etc/nginx/custom/r-music-inject.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /custom-logo.svg {
        alias /etc/nginx/custom/r-music-logo.svg;
        add_header Content-Type image/svg+xml;
    }

    location = /favicon.ico {
        alias /etc/nginx/custom/icons/favicon.ico;
    }

    location = /img/icons/favicon-32x32.png {
        alias /etc/nginx/custom/icons/favicon-32x32.png;
    }

    location = /img/icons/apple-touch-icon-152x152.png {
        alias /etc/nginx/custom/icons/apple-touch-icon-152x152.png;
    }

    # 3. 智能换源与 API 代理分流中枢
    location /api/ {
        proxy_pass http://music-enhancer:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. AI 智能音乐搜索与意图分发
    location /ai/ {
        proxy_pass http://music-enhancer:3001/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
