server {
    listen 80;
    server_name localhost;

    # 1. 统一前端 (YesPlayMusic)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 一次性清理客户端旧状态：访问 /?reset=1 即让浏览器清空本站缓存与存储
        # （含修复前遗留的旧 Workbox Service Worker，它会一直喂给播放器失效的旧链接）
        if ($arg_reset) {
            add_header Clear-Site-Data '"cache", "storage"' always;
        }

        # 新前端（Vue 3 重写）自带品牌、主题与 AI 面板，不再注入旧站的定制脚本；
        # 只保留一个「Service Worker 清理」：老用户浏览器里可能还注册着旧 Workbox SW，
        # 它会一直喂旧缓存，必须让它自毁一次。
        # 只在检测到旧 SW 时才注销并清缓存（新站没有 SW，这里等于空操作，
        # 也不会误伤将来可能加的 PWA 缓存）
        sub_filter "</head>" "<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){if(!rs.length)return;rs.forEach(function(r){r.unregister()});if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}})}</script></head>";
        sub_filter_once on;
        sub_filter_types text/html;

        # HTML 不缓存：assets 带内容哈希可长缓存，但入口必须随时取到新的
        # 注意：不能用 location = /index.html 单独处理，精确匹配会跳过 sub_filter
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 2. 定制样式、脚本与品牌资产映射
    location = /custom-theme.css {
        alias /etc/nginx/custom/custom-theme.css;
        add_header Content-Type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /custom-player-enhancer.js {
        alias /etc/nginx/custom/r-music-inject.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 覆盖原版 Workbox Service Worker（原版会预缓存旧首页，导致注入脚本失效）
    location = /service-worker.js {
        alias /etc/nginx/custom/sw-reset.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /custom-logo.svg {
        alias /etc/nginx/custom/r-music-logo.png;
        add_header Content-Type image/png;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /custom-logo.png {
        alias /etc/nginx/custom/r-music-logo.png;
        add_header Content-Type image/png;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 播放诊断页（排查用，不参与业务）
    location = /diag.html {
        alias /etc/nginx/custom/diag.html;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-store";
    }

    location = /favicon.ico {
        alias /etc/nginx/custom/icons/favicon.ico;
    }

    location = /img/icons/favicon-32x32.png {
        alias /etc/nginx/custom/icons/favicon-32x32.png;
    }

    location = /img/icons/apple-touch-icon-152x152.png {
        alias /etc/nginx/custom/icons/apple-touch-icon-152x152.png;
    }

    # 3. 智能换源与 API 代理分流中枢
    #    官方可用 -> 直通 music-api；官方 url=null -> 调 Go 适配器严格匹配换源
    #    注意：proxy_pass 不带尾斜杠，enhancer 需要收到完整的 /api/ 前缀路径
    location /api/ {
        proxy_pass http://music-enhancer:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 音频代理需要边下边播，关闭缓冲才能正常拖动进度
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 4. 兼容旧版本已缓存的 /kuwo-proxy 直链
    location ~ ^/kuwo-proxy/(.*)$ {
        resolver 8.8.8.8;
        proxy_pass https://kw-bj.kuwo.cn/$1;
        proxy_set_header User-Agent "Mozilla/5.0";
        add_header Access-Control-Allow-Origin "*" always;
        proxy_buffering off;
    }
}
