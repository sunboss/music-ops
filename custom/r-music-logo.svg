<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 品牌主色系流光渐变 -->
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#4FACFE" />
      <stop offset="80%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121218" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.25" />
    </linearGradient>
    <!-- 高斯模糊滤镜增强微光 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景底板 (带微细质感边框) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#glowGrad)" stroke-width="3" />

  <!-- 背景环境微光光晕 -->
  <circle cx="256" cy="240" r="140" fill="url(#glowGrad)" filter="blur(30px)" />

  <!-- 律动声波装饰点 (音频频谱跃动) -->
  <g opacity="0.85">
    <rect x="86" y="270" width="12" height="50" rx="6" fill="#00F2FE" />
    <rect x="110" y="220" width="12" height="150" rx="6" fill="#00F2FE" />
    <rect x="414" y="240" width="12" height="110" rx="6" fill="#FF007F" />
    <rect x="390" y="280" width="12" height="40" rx="6" fill="#FF007F" />
  </g>

  <!-- 核心 "R" + 音频律动流线 (通过高级曲线精雕) -->
  <g filter="url(#neonGlow)">
    <!-- 字母 R 主竖柱 (声波音柱造型) -->
    <rect x="156" y="116" width="44" height="280" rx="22" fill="url(#rGrad)" />
    
    <!-- 字母 R 顶部圆弧波形 (融合高音谱耳与音圈) -->
    <path d="M 178 116 
             H 286 
             C 348 116, 388 152, 388 214 
             C 388 274, 346 308, 286 308 
             H 178" 
          fill="none" 
          stroke="url(#rGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 内部同心声波扩散线 (体现音乐广播中枢与共鸣) -->
    <path d="M 230 180 
             H 276 
             C 304 180, 324 194, 324 214 
             C 324 234, 304 248, 276 248 
             H 230" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.9" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- 字母 R 动感甩尾支腿 (极速冲刺声浪曲线) -->
    <path d="M 270 292 
             C 292 316, 314 346, 332 374 
             C 342 390, 356 396, 376 396 
             H 382" 
          fill="none" 
          stroke="url(#rGrad)" 
          stroke-width="44" 
          stroke-linecap="round" />
  </g>

  <!-- 核心高光反射律动点 -->
  <circle cx="276" cy="214" r="7" fill="#FFFFFF" />
</svg>
